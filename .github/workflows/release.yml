name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize releases so overlapping runs cannot race updates to latest.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test and build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tvendo
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: tvendo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tvendo -d tvendo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate release tag and version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-metadata.mjs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: node --test scripts/release.test.mjs
      - name: Backend static analysis and race integration tests
        working-directory: backend
        run: |
          go vet ./...
          go test -race -count=1 -timeout=10m ./...
        env:
          TEST_DATABASE_URL: postgres://tvendo:ci-test-password@127.0.0.1:5432/tvendo_test?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build and test CLI artifacts
        run: |
          sh scripts/build-cli.sh
          node scripts/smoke-cli.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: distribution/dist/*
          if-no-files-found: error
          retention-days: 30

  assets:
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-cli
          path: distribution/dist
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/verify-cli.mjs
      - name: Attach verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" distribution/dist/* --clobber

  npm:
    name: Publish npm CLI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-cli
          path: distribution/dist
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.2
      - name: Publish verified package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.mjs

  docker:
    name: Publish Docker Hub image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-cli
          path: distribution/dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: dyunwei/tvendo
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ needs.build.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CLI_SOURCE=cli-release
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
