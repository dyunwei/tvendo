name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node --test scripts/release.test.mjs
        working-directory: .
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tvendo
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: tvendo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvendo -d tvendo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Static analysis
        run: go vet ./...
      - name: Unit and integration tests with race detection
        run: go test -race -count=1 -timeout=10m -v ./...
        env:
          TEST_DATABASE_URL: postgres://tvendo:ci-test-password@127.0.0.1:5432/tvendo_test?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379/0

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --file backend/Dockerfile --tag tvendo:ci .
