name: CLI packages
on:
  push:
    branches: [main]
    tags: ['cli-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build six platform binaries and npm tarball
        run: sh scripts/build-cli.sh 0.1.0
      - name: Smoke test npm package and installer
        run: node scripts/smoke-cli.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tvendo-cli-0.1.0
          path: |
            distribution/dist/tvendo-*
            distribution/dist/SHA256SUMS
            distribution/dist/manifest.json
          retention-days: 14
