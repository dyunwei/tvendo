services:
  app:
    image: docker.1ms.run/dyunwei/tvendo:${TVENDO_VERSION:-latest}
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://tvendo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tvendo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-/run/secrets/wechat-pay/apiclient_key.pem}
      WECHAT_PAY_VERIFY_MODE: ${WECHAT_PAY_VERIFY_MODE:-public_key}
      WECHAT_PAY_PLATFORM_CERT_PATH: ${WECHAT_PAY_PLATFORM_CERT_PATH:-}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_PUBLIC_KEY_PATH: ${WECHAT_PAY_PUBLIC_KEY_PATH:-/run/secrets/wechat-pay/wechatpay_public_key.pem}
      SEARCH_EMBEDDING_URL: ${SEARCH_EMBEDDING_URL:-}
      SEARCH_EMBEDDING_MODEL: ${SEARCH_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      SEARCH_EMBEDDING_FORMAT: ${SEARCH_EMBEDDING_FORMAT:-auto}
      SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-}
      SEARCH_EMBEDDING_REVISION: ${SEARCH_EMBEDDING_REVISION:-1}
      SEARCH_EMBEDDING_API_KEY: ${SEARCH_EMBEDDING_API_KEY:-}
      SEARCH_MIN_SCORE: ${SEARCH_MIN_SCORE:-0.75}
      SEARCH_RERANK_URL: ${SEARCH_RERANK_URL:-}
      SEARCH_RERANK_MODEL: ${SEARCH_RERANK_MODEL:-qwen3-rerank}
      SEARCH_RERANK_FORMAT: ${SEARCH_RERANK_FORMAT:-dashscope}
      SEARCH_RERANK_API_KEY: ${SEARCH_RERANK_API_KEY:-}
      SEARCH_RERANK_CANDIDATES: ${SEARCH_RERANK_CANDIDATES:-30}
      SEARCH_RERANK_MIN_SCORE: ${SEARCH_RERANK_MIN_SCORE:-0.55}
      SEARCH_FALLBACK_TOOL_REF: ${SEARCH_FALLBACK_TOOL_REF:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    stop_grace_period: 80s
  postgres:
    image: docker.1ms.run/library/postgres:17-alpine
    environment:
      POSTGRES_USER: tvendo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tvendo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvendo -d tvendo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
